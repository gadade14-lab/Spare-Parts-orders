<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HI-TECH ELECTRONIC PARTS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
background:#eef3ff;
padding:20px;
}
.container{
max-width:1600px;
margin:auto;
}
.header{
background:linear-gradient(135deg,#004aad,#007bff);
padding:25px;
border-radius:20px;
color:white;
margin-bottom:25px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
position:relative;
}
.header h1{
font-size:34px;
}
.header p{
margin-top:8px;
opacity:0.9;
}
.search-box{
margin-top:20px;
}
.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}
.main-layout{
display:grid;
grid-template-columns:1fr 380px;
gap:25px;
align-items:start;
}
.products{
display:flex;
flex-direction:column;
gap:15px;
}
.card{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
border:2px solid transparent;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
transition:0.2s;
}
.card:hover{
border-color:#007bff;
}
.product-left{
display:flex;
align-items:center;
gap:18px;
flex:1;
}
.product-image img{
width:95px;
height:95px;
object-fit:cover;
border-radius:14px;
border:2px solid #e3e3e3;
background:white;
cursor:pointer;
transition:0.3s;
}
.product-image img:hover{
transform:scale(1.05);
}
.product-details{
flex:1;
}
.product-name{
font-size:18px;
font-weight:600;
color:#003b8e;
margin-bottom:8px;
}
.product-price{
font-size:24px;
font-weight:700;
color:#28a745;
}
.stock{
margin-top:6px;
font-size:14px;
font-weight:600;
}
.in-stock{
color:#28a745;
}
.out-stock{
color:red;
}
.product-right{
display:flex;
align-items:center;
gap:12px;
}
.qty-box{
display:flex;
align-items:center;
gap:8px;
}
.qty-btn{
width:38px;
height:38px;
border:none;
border-radius:8px;
background:#004aad;
color:white;
font-size:20px;
cursor:pointer;
}
.qty-input{
width:60px;
text-align:center;
padding:8px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
font-weight:bold;
}
.add-btn{
padding:12px 18px;
border:none;
border-radius:10px;
background:#ff9800;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
}
.add-btn:hover{
background:#e68900;
}
.disabled-btn{
background:#999 !important;
cursor:not-allowed;
}
.side-panel{
position:sticky;
top:20px;
}
.customer-box{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
margin-bottom:20px;
}
.customer-box h2{
color:#004aad;
margin-bottom:15px;
}
.customer-box input,
.customer-box textarea{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:14px;
}
.customer-box textarea{
resize:none;
height:80px;
}
.cart{
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}
.cart h2{
color:#004aad;
margin-bottom:20px;
}
.cart-item{
border-bottom:1px solid #eee;
padding:15px 0;
}
.cart-item-name{
font-weight:600;
}
.cart-item-details{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
}
.remove-btn{
background:red;
color:white;
border:none;
padding:6px 12px;
border-radius:8px;
cursor:pointer;
}
.total{
margin-top:20px;
font-size:28px;
font-weight:700;
color:#28a745;
}
.min-order{
margin-top:10px;
color:red;
font-size:14px;
font-weight:600;
text-align:center;
}
.order-btn{
width:100%;
margin-top:20px;
padding:16px;
border:none;
border-radius:12px;
background:#25D366;
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
}
.empty{
text-align:center;
color:#777;
padding:30px 0;
}
.image-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
padding:20px;
}
.image-popup img{
max-width:95%;
max-height:95%;
border-radius:18px;
background:white;
}
.close-popup{
position:absolute;
top:20px;
right:25px;
color:white;
font-size:40px;
font-weight:bold;
cursor:pointer;
}
.admin-btn {
    position: absolute;
    top: 20px;
    right: 25px;
    padding: 12px 20px;
    background: #ff5722;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}
.admin-panel {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100000;
}
.admin-content {
    background: white;
    width: 95%;
    max-width: 1100px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 20px;
    padding: 25px;
}
.product-row {
    display: grid;
    grid-template-columns: 2fr 80px 80px 3fr 70px 70px;
    gap: 10px;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid #eee;
}
.add-product-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin: 20px 0;
    padding: 20px;
    background: #f8f9ff;
    border-radius: 12px;
}
@media(max-width:900px){
.main-layout{grid-template-columns:1fr;}
.side-panel{position:relative;}
}
@media(max-width:700px){
.card{flex-direction:column;align-items:flex-start;}
.product-left{width:100%;}
.product-right{width:100%;justify-content:space-between;}
}
</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>HI-TECH ELECTRONIC PARTS</h1>
<p>Electronic Parts Ordering System</p>
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search Products...">
</div>
<button class="admin-btn" onclick="toggleAdminPanel()">👨‍💼 Manage Products</button>
</div>

<div class="main-layout">
<div class="products" id="productList"></div>

<div class="side-panel">
<div class="customer-box">
<h2>👤 Customer Details</h2>
<input type="text" id="customerName" placeholder="Customer Name">
<textarea id="customerAddress" placeholder="Customer Address"></textarea>
<input type="text" id="customerPincode" placeholder="Pincode">
<input type="text" id="customerState" placeholder="State">
<input type="text" id="customerMobile" placeholder="Mobile Number">
</div>

<div class="cart">
<h2>🛒 Order Cart</h2>
<div id="cartItems">
<div class="empty">No Products Added</div>
</div>
<div class="total" id="total">₹0</div>
<div class="min-order">Minimum Order Value ₹2000 Required</div>
<button class="order-btn" onclick="placeOrder()">PLACE ORDER</button>
</div>
</div>
</div>
</div>

<div id="imagePopup" class="image-popup">
<span class="close-popup" onclick="closeImage()">✕</span>
<img id="popupImg">
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin-panel">
<div class="admin-content">
<h2>Manage Products (GitHub)</h2>
<button onclick="toggleAdminPanel()" style="float:right;background:#f44336;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;">Close</button>

<div class="add-product-form">
<input type="text" id="newName" placeholder="Product Name">
<input type="number" id="newPrice" placeholder="Price ₹">
<input type="number" id="newStock" placeholder="Stock">
<input type="text" id="newImage" placeholder="Image URL">
<button onclick="addNewProduct()" style="background:#28a745;color:white;">Add Product</button>
<button onclick="exportProducts()" style="background:#007bff;color:white;">Export JSON for GitHub</button>
</div>

<div id="adminProductList"></div>
</div>
</div>

<script>
// Global Variables
let products = [];
let cart = [];

const productList = document.getElementById("productList");
const cartItems = document.getElementById("cartItems");
const totalBox = document.getElementById("total");

// Load products from products.json
fetch('products.json')
  .then(response => response.json())
  .then(data => {
    products = data;
    renderProducts();
  })
  .catch(err => {
    console.error(err);
    alert("products.json file nahi mili! GitHub pe products.json upload karo.");
  });

// Render Products
function renderProducts(search=""){
  let html = "";
  products.filter(product => 
    product.name.toLowerCase().includes(search.toLowerCase())
  ).forEach((product, index) => {
    html += `
    <div class="card">
      <div class="product-left">
        <div class="product-image">
          <img src="${product.image}" onclick="openImage('${product.image}')">
        </div>
        <div class="product-details">
          <div class="product-name">${product.name}</div>
          <div class="product-price">₹${product.price}</div>
          ${product.stock > 0 ? 
            `<div class="stock in-stock">Available Stock : ${product.stock}</div>` : 
            `<div class="stock out-stock">❌ OUT OF STOCK</div>`
          }
        </div>
      </div>
      <div class="product-right">
        <div class="qty-box">
          <button class="qty-btn" onclick="decreaseQty(${index})">-</button>
          <input type="number" class="qty-input" id="qty${index}" value="1" min="1" max="${product.stock}">
          <button class="qty-btn" onclick="increaseQty(${index})">+</button>
        </div>
        ${product.stock > 0 ? 
          `<button class="add-btn" onclick="addToCart(${index})">ADD</button>` : 
          `<button class="add-btn disabled-btn" disabled>OUT OF STOCK</button>`
        }
      </div>
    </div>`;
  });
  productList.innerHTML = html;
}

// All other functions (openImage, qty, cart, placeOrder, etc.) remain same as original
function openImage(image){ document.getElementById("imagePopup").style.display = "flex"; document.getElementById("popupImg").src = image; }
function closeImage(){ document.getElementById("imagePopup").style.display = "none"; }

function increaseQty(index){
  let qty = document.getElementById(`qty${index}`);
  let current = parseInt(qty.value);
  if(current < products[index].stock) qty.value = current + 1;
}
function decreaseQty(index){
  let qty = document.getElementById(`qty${index}`);
  if(parseInt(qty.value) > 1) qty.value = parseInt(qty.value) - 1;
}

function addToCart(index){
  const product = products[index];
  if(product.stock <= 0) return alert("Product Out Of Stock");
  let qty = parseInt(document.getElementById(`qty${index}`).value);
  if(qty > product.stock) return alert("Only " + product.stock + " Stock Available");

  const existing = cart.find(item => item.name === product.name);
  if(existing){
    if(existing.qty + qty > product.stock) return alert("Stock Limit Exceeded");
    existing.qty += qty;
  } else {
    cart.push({name:product.name, price:product.price, qty:qty});
  }
  renderCart();
}

function renderCart(){
  if(cart.length === 0){
    cartItems.innerHTML = `<div class="empty">No Products Added</div>`;
    totalBox.innerHTML = "₹0";
    return;
  }
  let total = 0;
  let cartHTML = "";
  cart.forEach((item, index) => {
    let subTotal = item.price * item.qty;
    total += subTotal;
    cartHTML += `
    <div class="cart-item">
      <div class="cart-item-name">${item.name}</div>
      <div class="cart-item-details">
        <div>Qty : ${item.qty}<br>₹${subTotal}</div>
        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
      </div>
    </div>`;
  });
  cartItems.innerHTML = cartHTML;
  totalBox.innerHTML = `₹${total}`;
}

function removeItem(index){
  cart.splice(index,1);
  renderCart();
}

function placeOrder(){
  // (Original placeOrder function same rakha hai)
  let customerName = document.getElementById("customerName").value.trim();
  let customerAddress = document.getElementById("customerAddress").value.trim();
  let customerPincode = document.getElementById("customerPincode").value.trim();
  let customerState = document.getElementById("customerState").value.trim();
  let customerMobile = document.getElementById("customerMobile").value.trim();

  if(!customerName || !customerAddress || !customerPincode || !customerState || !customerMobile){
    return alert("Please Fill Customer Details");
  }
  if(cart.length === 0) return alert("Please Add Products");

  let total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  if(total < 2000) return alert("Minimum Order Value Must Be ₹2000");

  let message = "🛒 HI-TECH ELECTRONIC PARTS ORDER%0A%0A" +
    "👤 CUSTOMER DETAILS%0A%0A" +
    "Name : " + customerName + "%0A" +
    "Address : " + customerAddress + "%0A" +
    "Pincode : " + customerPincode + "%0A" +
    "State : " + customerState + "%0A" +
    "Mobile : " + customerMobile + "%0A%0A" +
    "📦 ORDER DETAILS%0A%0A";

  cart.forEach(item => {
    let sub = item.price * item.qty;
    message += "Product : " + item.name + "%0AQty : " + item.qty + "%0APrice : ₹" + sub + "%0A%0A";
  });
  message += "💰 TOTAL : ₹" + total;

  let phone = "918208825986";
  window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
}

// Admin Functions
function toggleAdminPanel(){
  const panel = document.getElementById('adminPanel');
  panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
  if(panel.style.display === 'flex') renderAdminProducts();
}

function renderAdminProducts(){
  let html = `<div class="product-row" style="font-weight:600;background:#f0f0f0;">
    <div>Name</div><div>Price</div><div>Stock</div><div>Image URL</div><div></div><div></div>
  </div>`;
  products.forEach((p, i) => {
    html += `
    <div class="product-row">
      <input type="text" value="${p.name}" id="name${i}">
      <input type="number" value="${p.price}" id="price${i}">
      <input type="number" value="${p.stock}" id="stock${i}">
      <input type="text" value="${p.image}" id="img${i}">
      <button onclick="saveProduct(${i})" style="background:#007bff;color:white;">Save</button>
      <button onclick="deleteProduct(${i})" style="background:#f44336;color:white;">Delete</button>
    </div>`;
  });
  document.getElementById('adminProductList').innerHTML = html;
}

function saveProduct(i){
  products[i].name = document.getElementById(`name${i}`).value;
  products[i].price = parseInt(document.getElementById(`price${i}`).value) || 0;
  products[i].stock = parseInt(document.getElementById(`stock${i}`).value) || 0;
  products[i].image = document.getElementById(`img${i}`).value;
  alert("✅ Product Updated!");
  renderProducts(document.getElementById("searchInput").value);
  renderAdminProducts();
}

function deleteProduct(i){
  if(confirm("Delete this product?")){
    products.splice(i,1);
    alert("Product Deleted");
    renderProducts(document.getElementById("searchInput").value);
    renderAdminProducts();
  }
}

function addNewProduct(){
  const name = document.getElementById('newName').value.trim();
  const price = parseInt(document.getElementById('newPrice').value);
  const stock = parseInt(document.getElementById('newStock').value) || 0;
  const image = document.getElementById('newImage').value.trim();
  if(!name || !price || !image) return alert("Name, Price aur Image URL bhariye!");
  products.push({name, price, stock, image});
  alert("✅ New Product Added!");
  document.getElementById('newName').value = '';
  document.getElementById('newPrice').value = '';
  document.getElementById('newStock').value = '';
  document.getElementById('newImage').value = '';
  renderProducts(document.getElementById("searchInput").value);
  renderAdminProducts();
}

function exportProducts(){
  const jsonStr = JSON.stringify(products, null, 2);
  const blob = new Blob([jsonStr], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "products.json";
  a.click();
  alert("✅ products.json download ho gaya! Ise GitHub pe upload / replace kar do.");
}

// Search
document.getElementById("searchInput").addEventListener("input", function(){
  renderProducts(this.value);
});
</script>
</body>
</html>
