<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HI-TECH ELECTRONIC PARTS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef3ff;
padding:20px;
}

.container{
max-width:1600px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#004aad,#007bff);
padding:25px;
border-radius:20px;
color:white;
margin-bottom:25px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.header h1{
font-size:34px;
}


.header-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.header-logo{width:180px;max-width:100%;background:white;padding:8px;border-radius:12px;}

.header p{
margin-top:8px;
opacity:0.9;
}

.search-box{
margin-top:20px;
}

.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}

.main-layout{
display:grid;
grid-template-columns:1fr 380px;
gap:25px;
align-items:start;
}

.products{
display:flex;
flex-direction:column;
gap:15px;
}

.card{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
border:2px solid transparent;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
transition:0.2s;
}

.card:hover{
border-color:#007bff;
}

.product-left{
display:flex;
align-items:center;
gap:18px;
flex:1;
}

.product-image img{
width:95px;
height:95px;
object-fit:cover;
border-radius:14px;
border:2px solid #e3e3e3;
background:white;
cursor:pointer;
transition:0.3s;
}

.product-image img:hover{
transform:scale(1.05);
}

.product-details{
flex:1;
}

.product-name{
font-size:18px;
font-weight:600;
color:#003b8e;
margin-bottom:8px;
}

.product-price{
font-size:24px;
font-weight:700;
color:#28a745;
}

.stock{
margin-top:6px;
font-size:14px;
font-weight:600;
}

.in-stock{
color:#28a745;
}

.out-stock{
color:red;
}

.product-right{
display:flex;
align-items:center;
gap:12px;
}

.qty-box{
display:flex;
align-items:center;
gap:8px;
}

.qty-btn{
width:38px;
height:38px;
border:none;
border-radius:8px;
background:#004aad;
color:white;
font-size:20px;
cursor:pointer;
}

.qty-input{
width:60px;
text-align:center;
padding:8px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
font-weight:bold;
}

.add-btn{
padding:12px 18px;
border:none;
border-radius:10px;
background:#ff9800;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
}

.add-btn:hover{
background:#e68900;
}

.disabled-btn{
background:#999 !important;
cursor:not-allowed;
}

.side-panel{
position:sticky;
top:20px;
}

.customer-box{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
margin-bottom:20px;
}

.customer-box h2{
color:#004aad;
margin-bottom:15px;
}

.customer-box input,
.customer-box textarea{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:14px;
}

.customer-box textarea{
resize:none;
height:80px;
}

.cart{
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.cart h2{
color:#004aad;
margin-bottom:20px;
}

.cart-item{
border-bottom:1px solid #eee;
padding:15px 0;
}

.cart-item-name{
font-weight:600;
}

.cart-item-details{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
}

.remove-btn{
background:red;
color:white;
border:none;
padding:6px 12px;
border-radius:8px;
cursor:pointer;
}

.total{
margin-top:20px;
font-size:28px;
font-weight:700;
color:#28a745;
}

.min-order{
margin-top:10px;
color:red;
font-size:14px;
font-weight:600;
text-align:center;
}

.order-btn{
width:100%;
margin-top:20px;
padding:16px;
border:none;
border-radius:12px;
background:#25D366;
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
}

.empty{
text-align:center;
color:#777;
padding:30px 0;
}

.image-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
padding:20px;
}

.image-popup img{
max-width:95%;
max-height:95%;
border-radius:18px;
background:white;
}

.close-popup{
position:absolute;
top:20px;
right:25px;
color:white;
font-size:40px;
font-weight:bold;
cursor:pointer;
}

@media(max-width:900px){

.main-layout{
grid-template-columns:1fr;
}

.side-panel{
position:relative;
}

}

@media(max-width:700px){

.card{
flex-direction:column;
align-items:flex-start;
}

.product-left{
width:100%;
}

.product-right{
width:100%;
justify-content:space-between;
}

}

</style>
</head>

let cart = [];

const productList = document.getElementById("productList");
const cartItems = document.getElementById("cartItems");
const totalBox = document.getElementById("total");

/* =========================
RENDER PRODUCTS
========================= */

function renderProducts(search=""){

let html = "";

products
.filter(product =>
product.name.toLowerCase().includes(search.toLowerCase())
)

.forEach((product,index)=>{

html += `

<div class="card">

<div class="product-left">

<div class="product-image">
<img src="${product.image}" onclick="openImage('${product.image}')">
</div>

<div class="product-details">

<div class="product-name">
${product.name}
</div>

<div class="product-price">
₹${product.price}
</div>

${
product.stock > 0
?
`<div class="stock in-stock">
Available Stock : ${product.stock}
</div>`
:
`<div class="stock out-stock">
❌ OUT OF STOCK
</div>`
}

</div>
</div>

<div class="product-right">

<div class="qty-box">

<button class="qty-btn"
onclick="decreaseQty(${index})">
-
</button>

<input type="number"
class="qty-input"
id="qty${index}"
value="1"
min="1"
max="${product.stock}">

<button class="qty-btn"
onclick="increaseQty(${index})">
+
</button>

</div>

${
product.stock > 0
?
`<button class="add-btn"
onclick="addToCart(${index})">
ADD
</button>`
:
`<button class="add-btn disabled-btn" disabled>
OUT OF STOCK
</button>`
}

</div>
</div>

`;

});

productList.innerHTML = html;

}

/* =========================
IMAGE POPUP
========================= */

function openImage(image){

document.getElementById("imagePopup").style.display = "flex";

document.getElementById("popupImg").src = image;

}

function closeImage(){

document.getElementById("imagePopup").style.display = "none";

}

/* =========================
QTY FUNCTIONS
========================= */

function increaseQty(index){

let qty = document.getElementById(`qty${index}`);

let current = parseInt(qty.value);

if(current < products[index].stock){

qty.value = current + 1;

}

}

function decreaseQty(index){

let qty = document.getElementById(`qty${index}`);

if(parseInt(qty.value) > 1){

qty.value = parseInt(qty.value) - 1;

}

}

/* =========================
ADD TO CART
========================= */

function addToCart(index){

const product = products[index];

if(product.stock <= 0){

alert("Product Out Of Stock");

return;

}

let qty = parseInt(
document.getElementById(`qty${index}`).value
);

if(qty > product.stock){

alert("Only " + product.stock + " Stock Available");

return;

}

const existing = cart.find(item =>
item.name === product.name
);

let alreadyQty = existing ? existing.qty : 0;

if(alreadyQty + qty > product.stock){

alert("Stock Limit Exceeded");

return;

}

if(existing){

existing.qty += qty;

}else{

cart.push({
name:product.name,
price:product.price,
qty:qty
});

}

renderCart();

}

/* =========================
RENDER CART
========================= */

function renderCart(){

if(cart.length === 0){

cartItems.innerHTML = `
<div class="empty">
No Products Added
</div>
`;

totalBox.innerHTML = "₹0";

return;

}

let total = 0;
let cartHTML = "";

cart.forEach((item,index)=>{

let subTotal = item.price * item.qty;

total += subTotal;

cartHTML += `

<div class="cart-item">

<div class="cart-item-name">
${item.name}
</div>

<div class="cart-item-details">

<div>
Qty : ${item.qty}<br>
₹${subTotal}
</div>

<button class="remove-btn"
onclick="removeItem(${index})">
Remove
</button>

</div>
</div>

`;

});

cartItems.innerHTML = cartHTML;

totalBox.innerHTML = `₹${total}`;

}

/* =========================
REMOVE ITEM
========================= */

function removeItem(index){

cart.splice(index,1);

renderCart();

}

/* =========================
PLACE ORDER
========================= */

function placeOrder(){

let customerName =
document.getElementById("customerName").value.trim();

let customerAddress =
document.getElementById("customerAddress").value.trim();

let customerPincode =
document.getElementById("customerPincode").value.trim();

let customerState =
document.getElementById("customerState").value.trim();

let customerMobile =
document.getElementById("customerMobile").value.trim();

if(
customerName == "" ||
customerAddress == "" ||
customerPincode == "" ||
customerState == "" ||
customerMobile == ""
){

alert("Please Fill Customer Details");

return;

}

if(cart.length === 0){

alert("Please Add Products");

return;

}

let total = 0;

cart.forEach(item=>{
total += item.price * item.qty;
});

if(total < 2000){

alert("Minimum Order Value Must Be ₹2000");

return;

}

let message =
"🛒 HI-TECH ELECTRONIC PARTS ORDER%0A%0A";

message +=
"👤 CUSTOMER DETAILS%0A%0A" +
"Name : " + customerName + "%0A" +
"Address : " + customerAddress + "%0A" +
"Pincode : " + customerPincode + "%0A" +
"State : " + customerState + "%0A" +
"Mobile : " + customerMobile + "%0A%0A";

message += "📦 ORDER DETAILS%0A%0A";

cart.forEach(item=>{

let sub = item.price * item.qty;

message +=
"Product : " + item.name + "%0A" +
"Qty : " + item.qty + "%0A" +
"Price : ₹" + sub + "%0A%0A";

});

message += "💰 TOTAL : ₹" + total;

let phone = "918208825986";

window.open(
`https://wa.me/${phone}?text=${message}`,
"_blank"
);

}

SEARCH
========================= */

document
.getElementById("searchInput")
.addEventListener("input",function(){

renderProducts(this.value);

});

/* =========================
INITIAL LOAD
========================= */

renderProducts();

</script>
