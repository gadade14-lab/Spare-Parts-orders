<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - HI-TECH ELECTRONIC PARTS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { background: linear-gradient(135deg, #f0f4ff, #e3e9ff); padding:20px; min-height:100vh; }
.container { max-width:1300px; margin:auto; }

.header {
    background: linear-gradient(135deg, #004aad, #007bff);
    color: white;
    padding: 25px 30px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 25px;
    box-shadow: 0 10px 25px rgba(0,74,173,0.3);
}

.search-box {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    margin-bottom: 20px;
}

.search-box input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

.add-form {
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    margin-bottom: 25px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
}

.add-form input {
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
}

.btn {
    padding: 14px 24px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
}

.add-btn { background: #28a745; color: white; }
.export-btn { background: #007bff; color: white; }

.admin-content {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    overflow: hidden;
}

.product-table { width: 100%; border-collapse: collapse; }
.product-row:hover { background: #f8fbff; }
.product-row td { padding: 14px 10px; border-bottom: 1px solid #eee; }

.product-row input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.action-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.save-btn { background: #28a745; color: white; }
.delete-btn { background: #f44336; color: white; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>👨‍💼 ADMIN PANEL</h1>
    <p>HI-TECH ELECTRONIC PARTS - Product Management</p>
  </div>

  <div class="search-box">
    <input type="text" id="adminSearch" placeholder="🔍 Search Products in Admin..." onkeyup="filterAdminProducts()">
  </div>

  <div class="add-form">
    <input type="text" id="newName" placeholder="Product Name">
    <input type="number" id="newPrice" placeholder="Price ₹">
    <input type="number" id="newStock" placeholder="Stock">
    <input type="text" id="newImage" placeholder="Image URL">
    <button class="btn add-btn" onclick="addNewProduct()">+ Add Product</button>
    <button class="btn export-btn" onclick="exportProducts()">📥 Export JSON</button>
  </div>

  <div class="admin-content">
    <div id="adminProductList"></div>
  </div>
</div>

<script>
let products = [];
const DELETE_PASSWORD = "admin123";   // ← Yahan apna password change kar sakte ho

fetch('products.json')
  .then(res => res.json())
  .then(data => {
    products = data;
    renderAdminProducts();
  })
  .catch(() => alert("products.json file nahi mili!"));

function filterAdminProducts() {
  const search = document.getElementById('adminSearch').value.toLowerCase();
  renderAdminProducts(search);
}

function renderAdminProducts(search = "") {
  let html = `
    <table class="product-table">
      <tr style="background:#f0f4ff; font-weight:600;">
        <td>Product Name</td>
        <td>Price (₹)</td>
        <td>Stock</td>
        <td>Image URL</td>
        <td colspan="2">Actions</td>
      </tr>`;

  products
    .filter(p => p.name.toLowerCase().includes(search))
    .forEach((p, i) => {
      html += `
        <tr class="product-row">
          <td><input type="text" value="${p.name}" id="name${i}"></td>
          <td><input type="number" value="${p.price}" id="price${i}"></td>
          <td><input type="number" value="${p.stock}" id="stock${i}"></td>
          <td><input type="text" value="${p.image}" id="img${i}"></td>
          <td><button class="action-btn save-btn" onclick="saveProduct(${i})">Save</button></td>
          <td><button class="action-btn delete-btn" onclick="deleteProduct(${i})">Delete</button></td>
        </tr>`;
    });

  html += `</table>`;
  document.getElementById('adminProductList').innerHTML = html;
}

function saveProduct(i) {
  products[i].name = document.getElementById(`name${i}`).value;
  products[i].price = parseInt(document.getElementById(`price${i}`).value) || 0;
  products[i].stock = parseInt(document.getElementById(`stock${i}`).value) || 0;
  products[i].image = document.getElementById(`img${i}`).value;
  alert("✅ Product Updated!");
  renderAdminProducts(document.getElementById('adminSearch').value);
}

function deleteProduct(i) {
  const enteredPass = prompt("🛡️ Delete karne ke liye Password enter karo:");
  if (enteredPass === DELETE_PASSWORD) {
    if(confirm("Kya aap sach mein is product ko delete karna chahte hain?")) {
      products.splice(i, 1);
      alert("✅ Product Deleted Successfully!");
      renderAdminProducts(document.getElementById('adminSearch').value);
    }
  } else {
    alert("❌ Wrong Password! Delete nahi hoga.");
  }
}

function addNewProduct() {
  const name = document.getElementById('newName').value.trim();
  const price = parseInt(document.getElementById('newPrice').value);
  const stock = parseInt(document.getElementById('newStock').value) || 0;
  const image = document.getElementById('newImage').value.trim();

  if(!name || !price || !image) {
    alert("❌ Name, Price aur Image URL jaruri hai!");
    return;
  }

  products.push({name, price, stock, image});
  alert("✅ New Product Added!");
  
  document.getElementById('newName').value = '';
  document.getElementById('newPrice').value = '';
  document.getElementById('newStock').value = '';
  document.getElementById('newImage').value = '';
  
  renderAdminProducts(document.getElementById('adminSearch').value);
}

function exportProducts() {
  const jsonStr = JSON.stringify(products, null, 2);
  const blob = new Blob([jsonStr], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "products.json";
  a.click();
  alert("✅ products.json Downloaded! GitHub pe upload kar do.");
}
</script>
</body>
</html>
